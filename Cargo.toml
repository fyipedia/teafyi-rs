[package]
name = "teafyi"
version = "0.1.0"
edition = "2021"
authors = ["FYIPedia"]
description = "Tea variety guide with brewing parameters and teaware — async API client for teafyi.com."
license = "MIT"
repository = "https://github.com/fyipedia/teafyi-rs"
homepage = "https://teafyi.com"
documentation = "https://docs.rs/teafyi"
readme = "README.md"
keywords = ["tea", "brewing", "teaware", "matcha", "oolong"]
categories = ["api-bindings", "data-structures"]

exclude = ["target/", "demo.gif", "demo.tape"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
